<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── ASCII page specific styles ── */
    .ascii-page {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px 24px 24px;
      min-height: 100%;
    }

    .ascii-page h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      margin: 0;
      color: var(--text-primary, #1d1d1f); /* cinza padrão */
      text-align: center;
      padding: 12px 0 8px;
      width: 100%;
    }

    .ascii-page p.subtitle {
      font-size: 0.78rem;
      color: var(--text-secondary, #8e8e93);
      margin: 0;
    }

    /* cover image at top */
    .ascii-cover {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 6px;
    }
    .ascii-cover img {
      width: 100%;
      max-width: 480px;
      height: auto;
      object-fit: cover;
      display: block;
      border: none;
      box-shadow: none;
    }

    /* Controls strip */
    .ascii-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      background: transparent;
      margin-bottom: 16px;
    }

    .ascii-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid #e6e6ea;
      background: #ffffff;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.12s ease, background 0.12s;
      color: var(--text-primary, #111);
      box-shadow: 0 4px 10px rgba(11,11,12,0.06);
    }
    .ascii-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(11,11,12,0.07);
    }
    .ascii-btn:active { transform: translateY(0); }
    .ascii-btn.active {
      background: #007aff;
      color: #fff;
      border-color: rgba(0,0,0,0.06);
      box-shadow: 0 8px 20px rgba(0,122,255,0.12);
    }

    .ascii-btn svg {
      width: 14px; height: 14px;
      flex-shrink: 0;
      opacity: 0.95;
    }

    /* hidden file input */
    #file-input { display: none; }

    /* Sliders row */
    .ascii-sliders {
      display: grid;
      grid-template-columns: 1fr minmax(220px, 360px);
      gap: 16px 20px;
      align-items: start;
      width: 100%;
    }
    .sliders-left, .sliders-right {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sliders-left { padding-right: 8px; }
    .sliders-right { align-items: stretch; padding-left: 8px; margin-bottom: 20px; }

    /* standardized slider layout: label | track | value */
    .slider-group {
      display: grid;
      grid-template-columns: 94px 1fr 56px;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      color: var(--text-secondary, #8e8e93);
      width: 100%;
      max-width: 760px;
    }
    .slider-group label { display: block; padding-left: 6px; color: var(--text-secondary,#8e8e93); }
    .slider-group input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: linear-gradient(90deg, #e9eef3, #eef2f6);
      outline: none;
      cursor: pointer;
      transition: box-shadow .12s ease, background .12s ease;
      display: block;
    }
    /* WebKit / Blink */
    .slider-group input[type=range]::-webkit-slider-runnable-track {
      height: 6px;
      border-radius: 999px;
      background: #e9eef3;
    }
    .slider-group input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(10,10,12,0.10);
      border: 1px solid rgba(0,0,0,0.06);
      cursor: pointer;
      margin-top: -3px;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    /* estilizar o thumb nativo para ser maior e combinando com a patinha (compatível com WebKit, Firefox, Edge) */
    .custom-thumb::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 30px; height: 30px;
      background: #ffffff;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 6px 16px rgba(0,0,0,0.14);
      cursor: pointer;
      margin-top: -12px; /* center vertically for 6px track */
    }
    .custom-thumb::-moz-range-thumb {
      width: 30px; height: 30px;
      background: #ffffff; border-radius: 50%; border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 6px 16px rgba(0,0,0,0.14);
      cursor: pointer;
    }
    .custom-thumb::-ms-thumb {
      width: 30px; height: 30px; background: #ffffff; border-radius: 50%; border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 6px 16px rgba(0,0,0,0.14);
      cursor: pointer;
    }

    /* emoji / image thumb overlay */
    .emoji-thumb {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -55%);
      pointer-events: none;
      width: 22px;
      height: 22px;
      object-fit: contain;
      border-radius: 50%;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.12));
      transition: transform .08s ease;
      display: inline-block;
      will-change: left, transform;
      z-index: 5;
    }
    .slider-group input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.06); box-shadow: 0 4px 10px rgba(10,10,12,0.12); }
    .slider-group input[type=range]:focus { box-shadow: 0 0 0 6px rgba(0,122,255,0.06); }
    /* Firefox */
    .slider-group input[type=range]::-moz-range-track {
      height: 6px;
      border-radius: 999px;
      background: #e9eef3;
    }
    .slider-group input[type=range]::-moz-range-thumb {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid rgba(0,0,0,0.06);
      box-shadow: 0 2px 6px rgba(10,10,12,0.10);
    }
    .slider-group input[type=range]::-moz-range-progress {
      background: rgba(0,122,255,0.12);
      height: 6px;
      border-radius: 999px;
    }
    .slider-group span { width: 48px; text-align: center; font-variant-numeric: tabular-nums; color: var(--text-primary, #1d1d1f); font-weight: 600; }

    /* Charset selector */
    .charset-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-secondary, #8e8e93);
      margin-bottom: 10px;
    }
    .charset-boxes {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 100%;
      margin-bottom: 12px;
    }
    .charset-option {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #e6e6ea;
      background: #fff;
      cursor: pointer;
      color: var(--text-primary, #111);
      font-size: 0.88rem;
      box-shadow: 0 3px 8px rgba(11,11,12,0.04);
      transition: background .12s ease, transform .08s ease, box-shadow .12s ease;
      max-width: 180px;
      white-space: normal;
      text-align: center;
    }
    .charset-option.active {
      background: #4b5563; /* cinza escuro */
      color: #fff; /* texto branco */
      border-color: transparent;
      box-shadow: 0 6px 18px rgba(75,85,99,0.14);
      transform: translateY(-1px);
    }
    .charset-option:focus { outline: 2px solid rgba(0,122,255,0.12); }

    /* Color toggle */
    .toggle-group {
      display: grid;
      grid-template-columns: 94px auto;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      color: var(--text-secondary, #8e8e93);
      padding-top: 4px;
      margin-bottom: 8px;
    }

    /* responsive: stack controls on small screens */
    @media (max-width: 820px) {
      .ascii-sliders { grid-template-columns: 1fr; }
      .sliders-right { padding-left: 0; margin-bottom: 12px; }
      .slider-group { grid-template-columns: 100px 1fr 44px; }
      .charset-boxes { justify-content: flex-start; margin-bottom: 6px; }
      .ascii-controls { margin-top: 10px; margin-bottom: 8px; gap: 12px; }
    }
    .toggle-switch {
      position: relative;
      width: 44px; height: 24px;
      display: inline-block;
    }
    .toggle-switch input { display: none; }
    .toggle-switch .knob {
      position: absolute; inset: 0;
      background: #eef0f3;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.14s;
    }
    .toggle-switch .knob::after {
      content: '';
      position: absolute;
      top: 4px; left: 4px;
      width: 16px; height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.14s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    }
    .toggle-switch input:checked + .knob { background: #007aff; }
    .toggle-switch input:checked + .knob::after { transform: translateX(20px); }

    /* Output area */
    .ascii-output-wrap {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      border: 1.5px solid rgba(0,0,0,0.1);
      background: #0d0d0d;
      min-height: 260px;
      flex: 1;
      padding: 6px;
    }

    /* hidden processing canvas */
    #process-canvas { display: none; }

    /* ASCII rendered on a visible canvas */
    #output-canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    /* placeholder shown before anything is loaded */
    .ascii-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: #555;
      font-size: 0.8rem;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .ascii-placeholder.hidden { opacity: 0; }
    .ascii-placeholder svg { opacity: 0.35; width: 40px; height: 40px; }

    /* status bar */
    .ascii-status {
      font-size: 0.7rem;
      color: var(--text-secondary, #8e8e93);
      text-align: right;
      min-height: 16px;
    }

    /* webcam feed (hidden, used as source) */
    #webcam-video {
      display: none;
      position: absolute;
    }

    /* dark-mode aware */
    @media (prefers-color-scheme: dark) {
      .ascii-btn {
        background: rgba(50,50,50,0.8);
        border-color: rgba(255,255,255,0.12);
        color: #f0f0f0;
      }
      .ascii-btn:hover { background: rgba(70,70,70,0.95); border-color: rgba(255,255,255,0.22); }
      .ascii-btn.active { background: #f0f0f0; color: #1d1d1f; border-color: #f0f0f0; }
      .slider-group input[type=range] { background: #444; }
      .slider-group input[type=range]::-webkit-slider-thumb { background: #f0f0f0; }
      .toggle-switch .knob { background: #444; }
      .toggle-switch input:checked + .knob { background: #f0f0f0; }
      .toggle-switch input:checked + .knob::after { background: #1d1d1f; }
      .charset-group select { background: rgba(50,50,50,0.8); border-color: rgba(255,255,255,0.12); color: #f0f0f0; }
    }
  </style>
</head>

  <script src="script.js"></script>
  <script>
  (function() {
    // ── Charsets ──────────────────────────────────────────────
    const CHARSETS = {
      ascii:   ' !"#$%&\'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~',
      simple:  ' .:-=+*#%@',
      blocks:  ' ░▒▓█',
      braille: ' ⠁⠃⠇⡇⣇⣧⣿'
    };

    // ── State ─────────────────────────────────────────────────
    let cols      = 130; // default midpoint -> 50%
    let brightness = 0;
    let contrast   = 0;
    let colored    = false;
    let invert     = false;
    let charset    = CHARSETS.ascii;
    let currentImage  = null;  // ImageBitmap or null

    // ── DOM refs ──────────────────────────────────────────────
    const fileInput    = document.getElementById('file-input');
    const btnUpload    = document.getElementById('btn-upload');
    const btnSave      = document.getElementById('btn-save');
    const slCols       = document.getElementById('sl-cols');
    const slBright     = document.getElementById('sl-bright');
    const slContrast   = document.getElementById('sl-contrast');
    const charsetButtons = document.querySelectorAll('.charset-option');
    const togColor     = document.getElementById('tog-color');
    const togInvert    = document.getElementById('tog-invert');
    const valCols      = document.getElementById('val-cols');
    const valBright    = document.getElementById('val-bright');
    const valContrast  = document.getElementById('val-contrast');
    const outputCanvas = document.getElementById('output-canvas');
    const processCanvas = document.getElementById('process-canvas');
    const placeholder  = document.getElementById('placeholder');
    const statusBar    = document.getElementById('status-bar');
    const outputWrap   = document.getElementById('output-wrap');

    const pCtx = processCanvas.getContext('2d', { willReadFrequently: true });
    const oCtx = outputCanvas.getContext('2d');

    // ── Font metrics (fixed width) ────────────────────────────
    const FONT_SIZE  = 8;   // px height in output canvas
    const FONT_FAMILY = 'monospace';
    const CHAR_W = FONT_SIZE * 0.6;
    const CHAR_H = FONT_SIZE;

    // ── Helpers ───────────────────────────────────────────────
    function setStatus(msg) { statusBar.textContent = msg; }

    function applyBrightnessContrast(val, b, c) {
      // contrast: factor
      const cf = (259 * (c + 255)) / (255 * (259 - c));
      let v = cf * (val - 128) + 128 + b;
      return Math.max(0, Math.min(255, v));
    }

    function charForBrightness(bright) {
      const cs = charset;
      let idx;
      if (invert) {
        idx = Math.floor((1 - bright / 255) * (cs.length - 1));
      } else {
        idx = Math.floor((bright / 255) * (cs.length - 1));
      }
      return cs[Math.max(0, Math.min(cs.length - 1, idx))];
    }

    // ── Core render ───────────────────────────────────────────
    function renderFrame(source, srcWidth, srcHeight) {
      if (!source) return;

      // compute rows to preserve aspect ratio
      const aspectRatio = srcHeight / srcWidth;
      const rows = Math.round(cols * aspectRatio * (CHAR_W / CHAR_H));

      // scale source into process canvas
      processCanvas.width  = cols;
      processCanvas.height = rows;
      pCtx.drawImage(source, 0, 0, cols, rows);

      const imgData = pCtx.getImageData(0, 0, cols, rows);
      const data    = imgData.data;

      // setup output canvas
      const outW = Math.round(cols  * CHAR_W);
      const outH = Math.round(rows  * CHAR_H);
      outputCanvas.width  = outW;
      outputCanvas.height = outH;

      // background
      oCtx.fillStyle = '#0d0d0d';
      oCtx.fillRect(0, 0, outW, outH);

      oCtx.font = `${FONT_SIZE}px ${FONT_FAMILY}`;
      oCtx.textBaseline = 'top';

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const i = (row * cols + col) * 4;
          let r = data[i], g = data[i+1], b = data[i+2];

          // apply brightness & contrast
          r = applyBrightnessContrast(r, brightness, contrast);
          g = applyBrightnessContrast(g, brightness, contrast);
          b = applyBrightnessContrast(b, brightness, contrast);

          // luminance
          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          const ch  = charForBrightness(lum);

          if (colored) {
            oCtx.fillStyle = `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
          } else {
            const v = Math.round(lum);
            oCtx.fillStyle = `rgb(${v},${v},${v})`;
          }

          oCtx.fillText(ch, col * CHAR_W, row * CHAR_H);
        }
      }

      placeholder.classList.add('hidden');
      setStatus(`${cols} × ${rows} chars · ${outW}×${outH}px`);
    }

    // ── Image upload ──────────────────────────────────────────
    btnUpload.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const bitmap = await createImageBitmap(file);
      currentImage = bitmap;
      renderFrame(bitmap, bitmap.width, bitmap.height);
      fileInput.value = '';
    });

    // ── Save ──────────────────────────────────────────────────
    btnSave.addEventListener('click', () => {
      if (!outputCanvas.width) return;
      const a = document.createElement('a');
      a.download = 'ascii-art.png';
      a.href = outputCanvas.toDataURL('image/png');
      a.click();
    });

    // ── Settings change → re-render ───────────────────────────
    function reRender() {
      if (currentImage) renderFrame(currentImage, currentImage.width, currentImage.height);
    }

    // Replace native thumb with emoji overlay and normalize displayed values
    function setupEmojiSlider(input, displaySpan, opts = {}) {
      const group = input.parentElement;
      group.style.position = 'relative';
      input.classList.add('custom-thumb');

      const thumb = document.createElement('img');
      thumb.className = 'emoji-thumb';
      thumb.alt = opts.alt || 'paw';
      thumb.src = opts.imgSrc || 'imagens/paw.png';
      thumb.style.width = opts.size || '18px';
      thumb.style.height = opts.size || '18px';
      thumb.onerror = () => { thumb.style.display = 'none'; };
      // hide the paw overlay if user requested removal
      if (opts.hideOverlay) thumb.style.display = 'none';
      group.appendChild(thumb);

      function updateThumb() {
        const min = Number(input.min || 0);
        const max = Number(input.max || 100);
        const val = Number(input.value);
        const pct = (max === min) ? 0 : (val - min) / (max - min);
        const trackWidth = input.clientWidth || 100;
        const left = (input.offsetLeft || 0) + Math.max(0, Math.min(1, pct)) * trackWidth;
        thumb.style.left = left + 'px';
        // small scale-up when active
        thumb.style.transform = 'translate(-50%, -50%)';
      }

      // display value normalization
      function updateDisplay() {
        const min = Number(input.min || 0);
        const max = Number(input.max || 100);
        const val = Number(input.value);
        if (opts.display === 'percent') {
          const pct = Math.round(((val - min) / (max - min)) * 100);
          displaySpan.textContent = String(pct);
        } else if (opts.display === 'offset') {
          displaySpan.textContent = String(val - min);
        } else {
          displaySpan.textContent = String(val);
        }
      }

      input.addEventListener('input', () => { updateThumb(); updateDisplay(); if (input === slCols) { cols = Number(input.value); } if (input === slBright) { brightness = Number(input.value); } if (input === slContrast) { contrast = Number(input.value); } reRender(); });
      window.addEventListener('resize', updateThumb);
      // init
      updateThumb();
      updateDisplay();
    }

    // make all slider thumbs and overlays the same size
    setupEmojiSlider(slCols, valCols, { imgSrc: 'imagens/paw.png', display: 'percent', size: '22px', hideOverlay: true });
    setupEmojiSlider(slBright, valBright, { imgSrc: 'imagens/paw.png', display: 'value', size: '22px', hideOverlay: true });
    setupEmojiSlider(slContrast, valContrast, { imgSrc: 'imagens/paw.png', display: 'value', size: '22px', hideOverlay: true });
    charsetButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        charsetButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const key = btn.dataset.value;
        charset = CHARSETS[key] || CHARSETS.ascii;
        reRender();
      });
    });
    togColor.addEventListener('change', () => {
      colored = togColor.checked;
      reRender();
    });
    togInvert.addEventListener('change', () => {
      invert = togInvert.checked;
      reRender();
    });

    // ── Drag-and-drop on output ───────────────────────────────
    outputWrap.addEventListener('dragover', (e) => {
      e.preventDefault();
      outputWrap.style.borderColor = 'rgba(0,0,0,0.35)';
    });
    outputWrap.addEventListener('dragleave', () => {
      outputWrap.style.borderColor = '';
    });
    outputWrap.addEventListener('drop', async (e) => {
      e.preventDefault();
      outputWrap.style.borderColor = '';
      const file = e.dataTransfer.files[0];
      if (!file || !file.type.startsWith('image/')) return;
      const bitmap = await createImageBitmap(file);
      currentImage = bitmap;
      renderFrame(bitmap, bitmap.width, bitmap.height);
    });

  })();
  </script>
</body>
